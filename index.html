    try {

      height: 24rem;
      border-radius: 50%;

    body::before {

    #startButton {

    .progress-stacked {

      background: rgba(8, 12, 24, .58);
      box-shadow: inset 0 1px 4px rgba(0, 0, 0, .25);

    .progress {
      background: transparent;
    }

    .progress-bar {
      border-radius: 999px;

    .progress-bar.bg-primary {

    :root,
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #101114;
      --panel: #191b20;
      --panel-raised: #14161b;
      --text: #f0f1f3;

      --accent-strong: #a5bcff;
      --accent-ink: #101522;
      --download: #7798e8;
      --upload: #62bea8;
      --field-focus: rgba(142, 171, 237, .2);
      --shadow: 0 16px 40px rgba(0, 0, 0, .2);
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --page: #f4f6fa;
      --panel: #fff;
      --panel-raised: #f6f7fa;
      --text: #20232b;
      --muted: #6c7280;
      --line: #dfe3ea;
      --accent: #526fc1;
      --accent-strong: #4563b7;
      --accent-ink: #fff;
      --download: #526fc1;
      --upload: #258b73;
      --field-focus: rgba(82, 111, 193, .15);
      --shadow: 0 14px 36px rgba(39, 51, 82, .08);
    }

    html { background: var(--page); }

    body {
      background: var(--page);
      color: var(--text);
      transition: background-color .2s ease, color .2s ease;
    }

    body::before,
    body::after,
    .bg-body-tertiary::before { display: none; }

    .container { max-width: 900px; }

    .page-toolbar {
      display: flex;
      justify-content: flex-end;
      padding: 12px 0 4px;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color .18s ease, background-color .18s ease, transform .18s ease;
    }

    .theme-toggle:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .theme-toggle:focus-visible {
      outline: 3px solid var(--field-focus);
      outline-offset: 2px;
    }

    .theme-toggle svg { width: 16px; height: 16px; }

    .bg-body-tertiary {
      border: 1px solid var(--line);
      background: var(--panel) !important;
      box-shadow: var(--shadow);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    #title,
    #desc {
      margin-right: auto;
      margin-left: auto;
      color: var(--text);
      text-align: center;
    }

    #title {
      font-size: clamp(2.5rem, 7vw, 4rem);
      letter-spacing: -.055em;
      text-shadow: none;
    }

    #desc {
      max-width: 640px;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.2rem);
    }

    hr { border-color: var(--line); }
    .form-label { color: var(--text); }

    .form-control,
    .btn-outline-primary,
    .btn-outline-success,
    .row.mb-4 > .col-12.mb-2 > .d-flex {
      border-color: var(--line);
      background: var(--panel-raised);
      box-shadow: none;
      color: var(--text);
    }

    .form-control:focus {
      border-color: var(--accent);
      background: var(--panel-raised);
      box-shadow: 0 0 0 3px var(--field-focus);
      color: var(--text);
    }

    .form-control:disabled { color: var(--muted); }
    .form-control::placeholder { color: var(--muted); }
    .text-muted, .text-body-secondary { color: var(--muted) !important; }
    #threadValue, .value-number { color: var(--text); }
    #totalProgressLabel, #totalSpeedLabel { color: var(--muted); }
    .row.mb-4 > .col-md-6,
    .row.mb-4 > .col-md-6 .value-number { color: var(--text); }

    .btn-outline-primary:hover,
    .btn-outline-primary.active {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 15%, var(--panel));
      color: var(--accent);
    }

    .btn-outline-success:hover,
    .btn-outline-success.active {
      border-color: var(--upload);
      background: color-mix(in srgb, var(--upload) 14%, var(--panel));
      color: var(--upload);
    }

    .btn-primary,
    .btn-primary:hover,
    .btn-primary:focus {
      border-color: var(--accent);
      background: var(--accent);
      box-shadow: none;
      color: var(--accent-ink);

    .progress-stacked {
      border-color: var(--line);
      background: var(--panel-raised);
      box-shadow: none;
    }

    .progress-bar.bg-primary { background: var(--download) !important; box-shadow: none; }
    .progress-bar.bg-success { background: var(--upload) !important; box-shadow: none; }
    .row.mb-4 > .col-12.mb-2 > .d-flex { border-radius: 10px; }

    @media (max-width: 480px) {
      #title { font-size: 2.4rem; }
      .container { --bs-gutter-x: 1.1rem; }
    }

            <div class="d-flex justify-content-between align-items-center">
              <div>
                <span class="value-number" id="totalBytesProcessed">0</span>
                <span id="totalProgressLabel">MB total</span>
              </div>
              <div class="text-end">
                <span class="value-number" id="totalTransferSpeed">0</span>
                <span id="totalSpeedLabel">MB/sec</span>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="d-flex align-items-center">
              <div class="me-2">
                <svg width="12" height="12"><rect width="12" height="12" style="fill:#0d6efd" /></svg>
              </div>
              <div>
                <span class="value-number" id="bytesDownloaded">0</span>
                <span id="downloadProgressLabel">MB downloaded</span>
              </div>
            </div>
          </div>
          <div class="col-md-6 text-md-end">
            <div class="d-flex align-items-center justify-content-md-end">
              <div class="me-2">
                <svg width="12" height="12"><rect width="12" height="12" style="fill:#198754" /></svg>
              </div>
              <div>
                <span class="value-number" id="bytesUploaded">0</span>
                <span id="uploadProgressLabel">MB uploaded</span>
              </div>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-12">
            <p id="statusMessage" class="text-warning"></p>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script>
    (() => {
      const button = document.getElementById("themeToggle");
      const label = document.getElementById("themeLabel");
      const icon = document.getElementById("themeIcon");
      const statusMessage = document.getElementById("statusMessage");

      function updateThemeButton(theme) {
        const nextTheme = theme === "dark" ? "light" : "dark";
        label.textContent = `${nextTheme === "light" ? "Light" : "Dark"} theme`;
        button.setAttribute("aria-label", `Switch to ${nextTheme} theme`);
        icon.innerHTML = nextTheme === "light"
          ? '<circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
          : '<path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.6 8.6 0 1 0 20.2 15.1Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';
      }

      const initialTheme = document.documentElement.dataset.theme === "light" ? "light" : "dark";
      document.documentElement.dataset.theme = initialTheme;
      updateThemeButton(initialTheme);

      button.addEventListener("click", () => {
        const theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        updateThemeButton(theme);
        try {
          localStorage.setItem("datawaster-theme", theme);
        } catch {
          statusMessage.textContent = "Theme changed, but this browser could not save your preference.";
          statusMessage.className = "text-warning";
        }
      });
    })();
  </script>
</body>
</html>
